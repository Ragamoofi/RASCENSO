<!doctype html><html lang="es"><meta charset="utf-8"><title>RASCENSO · Auditoría UX medible</title><style>html,body{margin:0;background:#07111c;color:#fff;font:12px Arial}header{height:44px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:4px 8px;white-space:nowrap}select,button{height:32px;background:#14263a;border:1px solid #536c84;color:#fff;border-radius:4px;padding:4px 8px}iframe{display:block;border:0}#metrics{display:block;height:26px;overflow:hidden;white-space:nowrap;font-size:10px}</style><header><select id="version"><option>before</option><option>current</option></select><select id="screen"></select><select id="viewport"><option>1920x1080</option><option>1600x900</option><option>1366x768</option><option>1280x720</option><option>768x1024</option><option>390x844</option><option>360x800</option></select><button id="load">Preparar vista</button><button id="measure">Medir</button><button id="top">Inicio</button><button id="next">Tramo siguiente</button><span id="status">Elige una pantalla</span></header><div id="stage" style="position:relative"><iframe id="game" title="RASCENSO auditado"></iframe></div><output id="metrics"></output><script type="module">
const $=s=>document.querySelector(s),frame=$('#game');const stages=['identidad','raices','futbolista','mentalidad','suenos','resumen'];
const screens=[...stages,'legado','adn','contratos','carrera','narrativa','balance','mercado','verano','historial','mundo','vestuario','retiro','ajustes','club',...Array.from({length:20},(_,i)=>'jugada'+i)];for(const k of screens){const o=document.createElement('option');o.value=k;o.textContent=k;$('#screen').append(o)}
const fixtures=Object.fromEntries(Array.from({length:20},(_,i)=>['jugada'+i,'season']));Object.assign(fixtures,{legado:'draft',adn:'dna',contratos:'academy',carrera:'season',narrativa:'narrative',balance:'recap',mercado:'transfer',verano:'summer',historial:'history',mundo:'history',vestuario:'history',retiro:'retired',ajustes:'season',club:'season'});
const selectors=Object.fromEntries(Array.from({length:20},(_,i)=>['jugada'+i,'.play-stage canvas']));Object.assign(selectors,{identidad:'[data-action="creator-next"]',raices:'[data-action="creator-next"]',futbolista:'[data-action="creator-next"]',mentalidad:'[data-action="creator-next"]',suenos:'[data-action="creator-next"]',resumen:'[data-action="create"]',legado:'[data-action="draft-accept"]',adn:'[data-action="academy-continue"]',contratos:'[data-action="academy"]',carrera:'[data-action="season-next"]',narrativa:'[data-action="event"]',balance:'[data-action="recap-continue"]',mercado:'[data-action="transfer"]',verano:'.summer-mode:not([disabled])',historial:'.history-cups summary',mundo:'.v2-legacy>summary',vestuario:'.v2-dna',retiro:'[data-action="share-png"]',ajustes:'[data-action="export"]',club:'[data-search]'});
function size(){const [w,h]=$('#viewport').value.split('x').map(Number);frame.width=w;frame.height=h;const scale=Math.min(1,innerWidth/w,(innerHeight-70)/h);frame.style.cssText=`position:absolute;left:0;top:0;transform-origin:top left;transform:scale(${scale})`;$('#stage').style.height=(h*scale)+'px';}size();$('#viewport').onchange=()=>{size();requestAnimationFrame(measure)};
let primary;
function measure(){const d=frame.contentDocument;if(!d?.querySelector('.site-head'))return;const win=frame.contentWindow,v=d.querySelector('main.view'),modal=d.querySelector('dialog[open],#modal');const candidate=d.querySelector('.play-window')||modal?.querySelector('.club497-main,.tool-panel')||v;primary=d.querySelector('.play-window')|| (candidate&&candidate.scrollHeight>candidate.clientHeight+2&&/(auto|scroll)/.test(win.getComputedStyle(candidate).overflowY)?candidate:d.scrollingElement);
const box=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {top:Math.round(r.top),bottom:Math.round(r.bottom),height:Math.round(r.height),width:Math.round(r.width)}};
const action=d.querySelector(selectors[$('#screen').value]),rect=box(action),H=win.innerHeight;const capture=frame.getBoundingClientRect();const data={capture:{x:capture.x,y:capture.y,width:capture.width,height:capture.height},scale:capture.width/win.innerWidth,version:$('#version').value,screen:$('#screen').value,viewport:$('#viewport').value,width:win.innerWidth,height:H,documentHeight:d.documentElement.scrollHeight,contentHeight:v?.scrollHeight,primary:primary===d.scrollingElement?'document':primary.className,scrollHeight:primary.scrollHeight,clientHeight:primary.clientHeight,scrollTop:Math.round(primary.scrollTop),primaryBox:box(primary),action:rect,actionVisible:!!rect&&rect.top>=0&&rect.bottom<=H,gameWindow:box(d.querySelector('.play-window')),gameStart:box(d.querySelector('.play-mobile-start')),gameBrief:box(d.querySelector('.play-mobile-brief')),decisionBoxes:[...d.querySelectorAll('[data-action="season-agenda"]')].map(box),summerActions:[...d.querySelectorAll('.summer-actions button')].map(box),brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src')),play:box(d.querySelector('[data-action="play-open"]')),decisions:box(d.querySelector('[data-action="season-agenda"]')),horizontalOverflow:d.documentElement.scrollWidth>win.innerWidth,cards:[...d.querySelectorAll('.lg-card,.summer-card')].map(box),ready:d.documentElement.dataset.auditReady||''};$('#metrics').textContent=JSON.stringify(data);$('#status').textContent=data.ready?'Lista · '+data.screen:'Cargando';return data;}
$('#measure').onclick=measure;$('#top').onclick=()=>{primary?.scrollTo(0,0);requestAnimationFrame(measure)};$('#next').onclick=()=>{const gap=primary===frame.contentDocument.scrollingElement?frame.contentWindow.innerHeight:primary.clientHeight;primary.scrollTop=Math.min(primary.scrollHeight-primary.clientHeight,primary.scrollTop+gap);requestAnimationFrame(measure)};
$('#load').onclick=async()=>{const screen=$('#screen').value;$('#status').textContent='Cargando';delete $('#status').dataset.ready;$('#metrics').textContent='';size();localStorage.removeItem('rascenso-save-v2-backup');if(stages.includes(screen)){localStorage.removeItem('rascenso-save-v2');localStorage.setItem('rascenso-creator-v31',JSON.stringify({draft:{name:'Oscar Sariego',city:'La Cisterna'},wizard:stages.indexOf(screen)}))}else{const state=await fetch('ux-'+fixtures[screen]+'.json').then(r=>r.json());localStorage.setItem('rascenso-save-v2',JSON.stringify(state))}frame.src=$('#version').value+'/index.html?screen='+screen+'&run='+Date.now();};frame.onload=()=>{const tick=()=>{if(frame.contentDocument?.documentElement.dataset.auditReady){measure();$('#status').dataset.ready=$('#version').value+':'+$('#screen').value+':'+$('#viewport').value;return;}requestAnimationFrame(tick)};tick()};
