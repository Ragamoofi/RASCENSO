name: Publicar RASCENSO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar módulos JavaScript
        run: |
          for file in src/*.mjs tests/*.mjs; do node --check "$file"; done
          node --check tests/browser/e2e.cjs
          node --check tests/browser/plays-e2e.cjs
          node --check tests/browser/brief-e2e.cjs
          node --check tests/browser/creator-e2e.cjs
      - name: Validar motor e interfaz
        run: |
          node --test tests/*.test.mjs
          node tests/ui-smoke.mjs
      - name: Comprobar recursos esenciales de publicación
        run: |
          test -s index.html
          test -s experience.css
          test -s src/experience.mjs
          test -s src/archetypes17.mjs
          test -s src/career08.mjs
          test -s src/legend-art.mjs
          test -s src/career10.mjs
          test -s assets/trophies/league.png
          test -s scripts/build_media12.py
          test -s scripts/restore_portraits.py
          test -s scripts/portrait_cache.py
          test -s src/media12.mjs
          test -s src/competition12.mjs
          test -s src/portrait12.mjs
          test -s src/competitions13.mjs
          test -s scripts/build_kits18.py
          test -s src/competitions14.mjs
          test -s src/career20.mjs
          test -s src/world20.mjs
          test -s src/story20.mjs
          test -s src/ui20.mjs
          test -s src/plays30.mjs
          test -s src/match2d.mjs
          test -s src/scenes-field.mjs
          test -s src/scenes-goal.mjs
          test -s src/plays-ui.mjs
          test -s src/identity30.mjs
          test -s src/creator30.mjs
          test -s assets/brand/rascenso-wordmark.png
          test -s assets/brand/rascenso-icon.png
          test -s favicon.png
          for file in assets/logos-{1..4}.json; do test -s "$file"; done
          test -s scripts/crest_commons.json
          python -m py_compile scripts/build_crests.py scripts/audit_crests.py scripts/build_trophy_gallery.py scripts/build_fm_trophy_pack.py
      - name: Auditar cobertura y equivalencias de los 874 escudos
        run: |
          node scripts/export-clubs.mjs
          python scripts/audit_crests.py
          python scripts/audit_crests.py
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio completo
        run: |
          mkdir -p _site
          cp index.html experience.css visual44.css favicon.svg favicon.png .nojekyll _site/
          cp -R src assets _site/
          node scripts/export-clubs.mjs
          python scripts/audit_crests.py
          python -m pip install -q pillow cairosvg
          python scripts/build_crests.py _site/assets/crests
          python scripts/build_media12.py _site
          python scripts/build_trophy_gallery.py _site
          python scripts/build_fm_trophy_pack.py _site
          python scripts/restore_portraits.py _site
          mkdir -p /tmp/rascenso-previous-photo-cache
          if git fetch -q origin media-audit:refs/remotes/origin/media-audit; then
            git archive refs/remotes/origin/media-audit | tar -x -C /tmp/rascenso-previous-photo-cache
          fi
          python scripts/portrait_cache.py import _site /tmp/rascenso-previous-photo-cache
          cat _site/assets/portrait-status.json
          test -s _site/assets/portrait-status.json
          python scripts/build_kits18.py _site/assets/kits
          test -s _site/assets/kits/CL.png
          test -s _site/assets/kits/NZ.png
          test -s _site/assets/MEDIA_CREDITS.html
          test -s _site/assets/portrait-catalog.json
          test -s _site/assets/portraits/lionel-messi.png
          test -s _site/assets/competitions/CL1.png
          test -s _site/assets/trophies/real-libertadores.png
          test -s _site/assets/trophies/real-premier.png
          test -s _site/assets/trophies/real-copachile.png
          test -s _site/assets/trophies/league-cl1.png
          test -s _site/assets/trophies/cup-cl.png
          test -s _site/assets/trophies/club-world.png
          test -s _site/assets/trophies/fm/102415.png
          test -s _site/assets/trophies/fm/1301394.png
          test -s _site/assets/trophies/fm/5250792.png
          test -s _site/assets/crests/cl-1.png
          test -s _site/assets/crest-manifest.json
          test -s _site/assets/crest-audit.json
          test -s _site/experience.css
          test -s _site/visual44.css
          test -s _site/assets/logos-1.json
      - name: Guardar informe de retratos por jugador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rascenso-photo-audit
          python scripts/portrait_cache.py export _site /tmp/rascenso-photo-audit
          cd /tmp/rascenso-photo-audit
          git init -q
          git checkout -q -b media-audit
          git config user.name "RASCENSO Media Audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portrait-status.json portrait-catalog.json portrait-debug.json portraits
          git commit -qm "audit: estado verificable de los 78 retratos"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/media-audit
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
