name: Publicar RASCENSO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar módulos JavaScript
        run: |
          for file in src/*.mjs tests/*.mjs; do node --check "$file"; done
      - name: Validar motor e interfaz
        run: |
          node --test tests/*.test.mjs
          node tests/ui-smoke.mjs
      - name: Comprobar recursos esenciales de publicación
        run: |
          test -s index.html
          test -s experience.css
          test -s src/experience.mjs
          test -s src/archetypes17.mjs
          test -s src/career08.mjs
          test -s src/legend-art.mjs
          test -s src/career10.mjs
          test -s assets/trophies/league.png
          test -s scripts/build_media12.py
          test -s src/media12.mjs
          test -s src/competition12.mjs
          test -s src/portrait12.mjs
          test -s src/competitions13.mjs
          test -s src/competitions14.mjs
          test -s assets/brand/rascenso-wordmark.png
          test -s assets/brand/rascenso-icon.png
          test -s favicon.png
          for file in assets/logos-{1..4}.json; do test -s "$file"; done
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio completo
        run: |
          mkdir -p _site
          cp index.html style.css experience.css favicon.svg favicon.png .nojekyll _site/
          cp -R src assets _site/
          node scripts/export-clubs.mjs
          python -m pip install -q pillow cairosvg
          python scripts/build_crests.py _site/assets/crests
          python scripts/build_media12.py _site
          test -s _site/assets/MEDIA_CREDITS.html
          test -s _site/assets/portrait-catalog.json
          test -s _site/assets/portraits/lionel-messi.png
          test -s _site/assets/competitions/CL1.png
          test -s _site/assets/trophies/real-libertadores.png
          test -s _site/assets/crests/cl-1.png
          test -s _site/experience.css
          test -s _site/assets/logos-1.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
