name: Prueba de jugadas en navegador
on:
  push:
    branches: [main, mejora-penales-controles, carrera-mundo35, jugadas36, duelos37, rascenso-4-integral]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Chromium y Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium firefox webkit
      - name: Validar motor y simular 20 jugadas
        run: |
          node --test tests/*.test.mjs
          node tests/browser/balance40.mjs
          node tests/career-sim40.mjs
      - name: Comprobar escenas en Chromium
        run: |
          mkdir -p /tmp/rascenso-capturas
          python3 -m http.server 8765 >/tmp/rascenso-http.log 2>&1 &
          SHOTS=/tmp/rascenso-capturas node tests/browser/plays-e2e.cjs
          node tests/browser/controls-e2e.cjs
          node tests/browser/e2e.cjs
          node tests/browser/e2e.cjs http://localhost:8765/index.html firefox
          node tests/browser/e2e.cjs http://localhost:8765/index.html webkit
          node tests/browser/viewport40.cjs
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-minijuegos
          path: /tmp/rascenso-capturas
          if-no-files-found: ignore
